name: Trigger auto deployment for group17cs553app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ docker ]
    paths:
    - '**'
    - '.github/workflows/group17cs553app-AutoDeployTrigger-b686dada-3b6f-4c8b-aa5d-553c8e59afaa.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.GROUP17CS553APP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GROUP17CS553APP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GROUP17CS553APP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: group17cs533b2024
          resourceGroup: group17cs553
          dockerfilePath: Dockerfile_i2m


