global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gradio_app'
    static_configs:
      - targets: ['i2m:8000']  # Use the service name 'i2m' instead of 'localhost'

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['i2m:9100']  # Use the service name 'i2m' instead of 'localhost'
